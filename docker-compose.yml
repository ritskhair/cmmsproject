services:
  db:
    image: postgres:16-alpine
    container_name: cmms_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cmms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_database_password}
      - POSTGRES_DB=${POSTGRES_DB:-cmmsproject}
    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmms_backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-cmms_user}:${POSTGRES_PASSWORD:-change_this_database_password}@db:5432/${POSTGRES_DB:-cmmsproject}}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      - OPERATOR_ALLOWED_NETWORKS=${OPERATOR_ALLOWED_NETWORKS:-127.0.0.1/32,::1/128,10.23.21.0/24,172.18.0.1/32}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: cmms_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  cmms_postgres_data:
